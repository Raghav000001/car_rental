<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    @media (prefers-color-scheme: light) {
      .background { fill: black; }
      .foreground { fill: white; }
    }
    @media (prefers-color-scheme: dark) {
      .background { fill: white; }
      .foreground { fill: black; }
    }
  </style>
  <rect class="background" width="180" height="180" rx="37" />
  <!-- Steering wheel -->
  <g transform="translate(90, 90)">
    <!-- Outer ring -->
    <circle class="foreground" cx="0" cy="0" r="58" stroke="currentColor" stroke-width="8" fill="none"/>
    <!-- Inner hub -->
    <circle class="foreground" cx="0" cy="0" r="14" fill="currentColor"/>
    <!-- Top spoke -->
    <rect class="foreground" x="-5" y="-55" width="10" height="38" rx="4" fill="currentColor"/>
    <!-- Bottom-left spoke -->
    <rect class="foreground" x="-5" y="18" width="10" height="38" rx="4" fill="currentColor" transform="rotate(-60)"/>
    <!-- Bottom-right spoke -->
    <rect class="foreground" x="-5" y="18" width="10" height="38" rx="4" fill="currentColor" transform="rotate(60)"/>
  </g>
</svg>
